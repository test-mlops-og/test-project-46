name: Conditional Pipeline and Deployment

on:
  push:
    branches:
      - '**'  # Trigger on push events from any branch

jobs:
  conditional-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.11'
      - name: Configure AWS Credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1
      - name: Install dependencies
        run: python -m pip install --upgrade botocore boto3 awscli sagemaker

      - name: Run Pipeline if requested
        if: contains(github.event.head_commit.message, '[RUN PIPELINES]')
        run: python run_pipeline.py

      - name: Deploy if requested
        if: contains(github.event.head_commit.message, '[DEPLOY]')
        run: python deployment.py
