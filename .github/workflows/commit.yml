name: Conditional Pipeline and Deployment

on:
  push:
    branches:
      - '**'  # Trigger on push events from any branch

jobs:
  conditional-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # add any additional dependencies as needed

      - name: Run Pipeline if requested
        if: contains(github.event.head_commit.message, '[RUN PIPELINES]')
        run: python run_pipeline.py

      - name: Deploy if requested
        if: contains(github.event.head_commit.message, '[DEPLOY]')
        run: python deployment.py
